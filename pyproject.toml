[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-websocket-protocol"
dynamic = ["version"]
description = "websocket network protocol for hivemind-core"
license = "Apache-2.0"
authors = [
    { name = "jarbasAi", email = "jarbasai@mailfence.com" }
]
requires-python = ">=3.10"
dependencies = [
    "tornado",
    "hivemind-plugin-manager",
    "poorman-handshake>=2.0.0a1,<3.0.0",
    "hivemind-core",
    "pyOpenSSL",
    "pybase64",
]

# The plugin is loaded by hivemind-core at runtime, which brings
# hivemind-core / hivemind-bus-client / ovos-bus-client / ovos-utils
# along for free. They are only declared here so the test suite can
# import the package standalone in CI. hivemind-core is AGPL; do not
# promote it to a runtime dep.
[project.optional-dependencies]
test = [
    "pytest",
    "hivemind-core",
    "hivemind-bus-client",
    "ovos-bus-client",
    "ovos-utils",
    "hivescope",
]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/hivemind-websocket-protocol"

[project.entry-points."hivemind.network.protocol"]
"hivemind-websocket-plugin" = "hivemind_websocket_protocol:HiveMindWebsocketProtocol"

[tool.setuptools.dynamic]
version = { attr = "hivemind_websocket_protocol.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["hivemind_websocket_protocol*"]

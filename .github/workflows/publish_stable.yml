name: Publish Stable Release

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: write   # required for version bump commit and release tag

jobs:
  publish_stable:
    if: github.actor != 'github-actions[bot]'
    uses: OpenVoiceOS/gh-automations/.github/workflows/publish-stable.yml@02b4bf45467b832c0e03c2e15ed02daa584b8386 # dev
    with:
      version_file: 'hivemind_websocket_protocol/version.py'
      # This fork has no PyPI publisher. Publish source releases until one is
      # configured explicitly instead of attempting an untrusted OIDC upload.
      publish_pypi: false
      publish_release: true
      sync_dev: true
      notify_matrix: false
